<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="abadiq-title">
  <title id="abadiq-title">ABADIQ</title>
  <!-- Almost-complete circle: gap at bottom between 7 o'clock (34,72) and 5 o'clock (66,72) -->
  <path
    d="M 34 72 A 32 32 0 1 1 66 72"
    fill="none"
    stroke="#472583"
    stroke-width="7"
    stroke-linecap="round"
  />
  <!-- A shape: peak inside circle, legs exit through gap endpoints -->
  <path
    d="M 34 72 L 50 20 L 66 72"
    fill="none"
    stroke="#472583"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Left tick -->
  <line x1="34" y1="72" x2="27" y2="84" stroke="#472583" stroke-width="7" stroke-linecap="round" />
  <!-- Right tick -->
  <line x1="66" y1="72" x2="73" y2="84" stroke="#472583" stroke-width="7" stroke-linecap="round" />
</svg>
