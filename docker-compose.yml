version: "3.8"

services:
  # React application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abadiq-app
    restart: unless-stopped
    networks:
      - app-network

  # Backend API service
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: abadiq-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_PORT=3001
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - app-network

  # Nginx SSL proxy
  nginx:
    image: nginx:alpine
    container_name: abadiq-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl-proxy.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
      - api
    networks:
      - app-network
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot
    container_name: abadiq-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  app-network:
    driver: bridge
